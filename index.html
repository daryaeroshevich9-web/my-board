<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска Дарьи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --text:#1f2630;
    --text-secondary:#525c69; --text-muted:#8a94a6;
    --border:rgba(82,92,105,.10); --accent:#2f7abf;
    --aviabit:#e0a800; --portal:#d64d6f; --other:#2f7abf; --danger:#dc2626;
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 10%, rgba(255,211,120,.22), transparent 38%),
      radial-gradient(circle at 88% 18%, rgba(255,182,197,.22), transparent 36%),
      radial-gradient(circle at 55% 92%, rgba(160,205,250,.25), transparent 40%),
      linear-gradient(180deg,#eef1f4,#e6eaef);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Onest',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(82,92,105,.28);border-radius:6px}

  .topbar{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,.78);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 20px rgba(16,24,40,.04);
  }
  .topbar-inner{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#2f7abf 0%,#5a9bd8 100%);
    box-shadow:0 2px 8px rgba(47,122,191,.35);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;
  }
  .title-block{min-width:160px}
  h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:20px;letter-spacing:.2px}
  .subtitle{font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:500}
  .quick-add{
    flex:1 1 220px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;
    font:inherit;font-size:14px;background:#fff;
  }
  .quick-add:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,122,191,.15)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .search-input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:13px;background:#fff;min-width:150px}
  .search-input:focus{outline:none;border-color:var(--accent)}
  .toolbar input[type="date"]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;cursor:pointer}
  .toolbar button{
    padding:8px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-family:inherit;font-weight:600;cursor:pointer;font-size:13px;transition:all .15s;
  }
  .toolbar button:hover{background:#1f5a8f;transform:translateY(-1px)}
  .icon-btn{
    width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:#fff;
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;
  }
  .icon-btn:hover{background:#f3f4f6;transform:translateY(-1px)}

  .summary{max-width:1240px;margin:0 auto;padding:20px 24px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .summary-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;align-items:center;gap:12px}
  .summary-icon{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
  .si-total{background:#eef2ff;color:#4f46e5}
  .si-progress{background:#fef3c7;color:#d97706}
  .si-done{background:#d1fae5;color:#059669}
  .si-trash{background:#fee2e2;color:#dc2626}
  .summary-text .num{font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;line-height:1.1}
  .summary-text .label{font-size:12px;color:var(--text-secondary);font-weight:500}

  .zones{max-width:1240px;margin:0 auto;padding:20px 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;align-items:start}
  .zone{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(16,24,40,.06)}
  .zone.drop-hover{outline:2px dashed var(--accent);outline-offset:4px}
  .zone-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .zone-emoji{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
  .ze-aviabit{background:linear-gradient(135deg,#fff3d0,#ffe08a)}
  .ze-portal{background:linear-gradient(135deg,#ffe0e7,#ffc7d3)}
  .ze-other{background:linear-gradient(135deg,#dbeafe,#bdd7f0)}
  .zone-head h2{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;letter-spacing:.3px}
  .count{margin-left:auto;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:var(--text-secondary);background:rgba(82,92,105,.08);min-width:28px;height:28px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .add-btn{width:28px;height:28px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:300;transition:all .15s;flex:none}
  .add-btn:hover{transform:scale(1.1);background:#1f5a8f}
  .notes{display:flex;flex-direction:column;gap:10px;min-height:40px}
  .note{
    position:relative;border-radius:12px;padding:12px 14px 12px 44px;
    font-size:14.5px;line-height:1.5;color:#2a3240;font-weight:500;
    border:1px solid transparent;box-shadow:0 2px 8px rgba(16,24,40,.05);
    transition:transform .18s, box-shadow .18s, opacity .18s;
    display:flex;align-items:flex-start;cursor:grab;
  }
  .note:active{cursor:grabbing}
  .note.dragging{opacity:.4;transform:scale(.98)}
  .note:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(16,24,40,.10)}
  .note::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--zone-color)}
  .zone-aviabit .note{background:#fff9e4;border-color:#f3e4b0;--zone-color:var(--aviabit)}
  .zone-portal .note{background:#ffeef2;border-color:#f5c6d1;--zone-color:var(--portal)}
  .zone-other .note{background:#f0f7ff;border-color:#c3daf1;--zone-color:var(--other)}
  .note-checkbox{position:absolute;left:12px;top:12px;width:20px;height:20px;flex:none;cursor:pointer;accent-color:var(--zone-color)}
  .note-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .note-content{cursor:text}
  .note.done{opacity:.5}
  .note.done .note-text{text-decoration:line-through}
  .emoji-chip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.75);box-shadow:0 1px 3px rgba(16,24,40,.12);margin-right:8px;font-size:15px;vertical-align:middle}
  .sub-count{font-size:11px;color:var(--text-muted);background:rgba(82,92,105,.08);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:600}
  .subtasks{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .subtask{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3a4350}
  .subtask input{width:16px;height:16px;accent-color:var(--zone-color);cursor:pointer;flex:none}
  .subtask .sub-text{flex:1;word-break:break-word}
  .subtask.done .sub-text{text-decoration:line-through;opacity:.6}
  .sub-del{border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;line-height:1}
  .sub-del:hover{background:rgba(220,38,38,.1);color:var(--danger)}
  .sub-add{border:1px dashed rgba(82,92,105,.3);background:transparent;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--text);width:100%}
  .sub-add:focus{outline:none;border-color:var(--accent);background:#fff}
  .note-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s;flex:none;margin-left:8px}
  .note:hover .note-actions{opacity:1}
  @media (hover:none){.note-actions{opacity:1}}
  .note-action{width:28px;height:28px;border:none;border-radius:6px;background:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex:none}
  .note-action:hover{background:#fff;transform:scale(1.1)}
  .note-action svg{width:16px;height:16px;color:var(--text-secondary)}
  .note-action.danger:hover{background:#fee2e2}
  .note-action.danger svg{color:var(--danger)}
  .empty{border:1px dashed rgba(82,92,105,.25);border-radius:12px;padding:24px 12px;text-align:center;font-size:13px;color:var(--text-muted);font-weight:500}

  .trash-section{max-width:1240px;margin:0 auto;padding:0 24px 64px}
  .trash-section.drop-hover .trash-header{outline:2px dashed var(--danger);outline-offset:4px}
  .trash-header{background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
  .trash-header:hover{background:#fee2e2}
  .trash-header h3{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;flex:1}
  .trash-toggle{width:24px;height:24px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;color:var(--text-secondary)}
  .trash-toggle.open{transform:rotate(180deg)}
  .trash-content{display:none}
  .trash-content.open{display:block}
  .trash-note{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .trash-note .note-text{flex:1;font-size:14px;color:var(--text-secondary)}
  .trash-actions{display:flex;gap:8px}
  .trash-btn{padding:6px 14px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .trash-btn.restore{background:#d1fae5;color:#059669}
  .trash-btn.restore:hover{background:#a7f3d0}
  .trash-btn.delete{background:#fee2e2;color:#dc2626}
  .trash-btn.delete:hover{background:#fecaca}

  .modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal-content{background:#fff;border-radius:16px;padding:24px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(16,24,40,.3);max-height:85vh;overflow-y:auto}
  .modal h3{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600;margin-bottom:16px}
  .modal input[type="text"]{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;margin-bottom:16px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .modal-btn{padding:10px 20px;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
  .modal-btn.primary{background:var(--accent);color:#fff}
  .modal-btn.primary:hover{background:#1f5a8f}
  .modal-btn.secondary{background:#f3f4f6;color:var(--text)}
  .modal-btn.secondary:hover{background:#e5e7eb}
  .move-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .move-btn{padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  .move-btn:hover{background:#f3f4f6}

  @media (max-width:720px){
    .topbar-inner{padding:12px 16px;gap:10px}
    h1{font-size:17px}
    .subtitle{display:none}
    .quick-add{flex:1 1 100%;order:3}
    .toolbar{margin-left:0;width:100%;order:4}
    .search-input{flex:1;min-width:0}
    .summary{padding:14px 16px 0;gap:10px}
    .summary-card{padding:10px 12px;gap:10px}
    .summary-icon{width:32px;height:32px;font-size:16px}
    .summary-text .num{font-size:18px}
    .summary-text .label{font-size:11px}
    .zones{padding:14px 16px 30px;gap:14px;grid-template-columns:1fr}
    .zone{border-radius:16px;padding:14px}
    .trash-section{padding:0 16px 40px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">✈️</div>
    <div class="title-block">
      <h1>Доска Дарьи</h1>
      <div class="subtitle">Авиабит · Портал 2.0 · Прочее</div>
    </div>
    <input type="text" class="quick-add" id="quickAdd" placeholder="Быстрая задача → Enter (упадёт в «Прочее»)">
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по доске и корзине">
      <input type="date" id="dateFrom">
      <input type="date" id="dateTo">
      <button id="generateReport">📊 Отчёт</button>
      <button class="icon-btn" id="backupDownload" title="Скачать резервную копию">⬇</button>
      <button class="icon-btn" id="backupUpload" title="Загрузить резервную копию">⬆</button>
      <input type="file" id="backupFile" accept=".json,application/json" style="display:none">
    </div>
  </div>
</header>

<div class="summary">
  <div class="summary-card"><div class="summary-icon si-total">📋</div><div class="summary-text"><div class="num" id="totalCount">0</div><div class="label">Всего задач</div></div></div>
  <div class="summary-card"><div class="summary-icon si-progress">⚡</div><div class="summary-text"><div class="num" id="progressCount">0</div><div class="label">В работе</div></div></div>
  <div class="summary-card"><div class="summary-icon si-done">✅</div><div class="summary-text"><div class="num" id="doneCount">0</div><div class="label">Выполнено</div></div></div>
  <div class="summary-card"><div class="summary-icon si-trash">🗑️</div><div class="summary-text"><div class="num" id="trashCount">0</div><div class="label">В корзине</div></div></div>
</div>

<main class="zones">
  <section class="zone" data-zone="aviabit">
    <header class="zone-head">
      <div class="zone-emoji ze-aviabit">🛩️</div><h2>Авиабит</h2>
      <span class="count" data-count="aviabit">0</span>
      <button class="add-btn" data-zone="aviabit" title="Добавить задачу">+</button>
    </header>
    <div class="notes" data-notes="aviabit"></div>
  </section>
  <section class="zone" data-zone="portal">
    <header class="zone-head">
      <div class="zone-emoji ze-portal">🚪</div><h2>Портал 2.0</h2>
      <span class="count" data-count="portal">0</span>
      <button class="add-btn" data-zone="portal" title="Добавить задачу">+</button>
    </header>
    <div class="notes" data-notes="portal"></div>
  </section>
  <section class="zone" data-zone="other">
    <header class="zone-head">
      <div class="zone-emoji ze-other">📋</div><h2>Прочее</h2>
      <span class="count" data-count="other">0</span>
      <button class="add-btn" data-zone="other" title="Добавить задачу">+</button>
    </header>
    <div class="notes" data-notes="other"></div>
  </section>
</main>

<div class="trash-section" id="trashDrop">
  <div class="trash-header" id="trashToggle">
    <span style="font-size:20px">🗑️</span>
    <h3>Корзина</h3>
    <span class="count" id="trashSectionCount">0</span>
    <button class="trash-toggle" id="trashArrow">▼</button>
  </div>
  <div class="trash-content" id="trashContent"></div>
</div>

<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Новая задача</h3>
    <input type="text" id="addInput" placeholder="Описание задачи...">
    <div class="modal-actions">
      <button class="modal-btn secondary" id="cancelAdd">Отмена</button>
      <button class="modal-btn primary" id="confirmAdd">Добавить</button>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Редактировать задачу</h3>
    <input type="text" id="editInput" placeholder="Описание задачи...">
    <div class="modal-actions">
      <button class="modal-btn secondary" id="cancelEdit">Отмена</button>
      <button class="modal-btn primary" id="confirmEdit">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="moveModal">
  <div class="modal-content">
    <h3>Переместить задачу</h3>
    <div class="move-list">
      <button class="move-btn" onclick="moveTask('aviabit')">🛩️ Авиабит</button>
      <button class="move-btn" onclick="moveTask('portal')">🚪 Портал 2.0</button>
      <button class="move-btn" onclick="moveTask('other')">📋 Прочее</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeMove()">Отмена</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'darya_board_tasks';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentAddZone = null;
let currentEditId = null;
let currentMoveId = null;

if (tasks.length === 0) {
  const now = new Date().toISOString();
  tasks = [
    {id: 1, zone: 'other', text: 'Разобрать логи инцидента с рейсом SU1234', done: false, created: now, doneAt: null, deleted: false, subtasks: [], subOpen: false},
    {id: 2, zone: 'other', text: 'Тестовая задача из чата (проверка интеграции)', done: false, created: now, doneAt: null, deleted: false, subtasks: [], subOpen: false},
    {id: 3, zone: 'other', text: 'Согласование SLA с топливозаправщиками', done: false, created: now, doneAt: null, deleted: false, subtasks: [], subOpen: false},
    {id: 4, zone: 'other', text: 'Обновить чек-лист предполетной подготовки', done: true, created: now, doneAt: now, deleted: false, subtasks: [], subOpen: false}
  ];
  saveTasks();
}
tasks.forEach(t => {
  if (!Array.isArray(t.subtasks)) t.subtasks = [];
  if (t.subOpen === undefined) t.subOpen = false;
  if (t.doneAt === undefined) t.doneAt = t.done ? new Date().toISOString() : null;
});

function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function splitEmoji(text) {
  const re = /^\s*(\p{Extended_Pictographic}(?:\uFE0F)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F)?)*)\s*/u;
  const m = text.match(re);
  if (m) return {emoji: m[1], rest: text.slice(m[0].length)};
  return {emoji: null, rest: text};
}
function matchesQuery(t, q) {
  if (!q) return true;
  if (t.text.toLowerCase().includes(q)) return true;
  return t.subtasks.some(s => s.text.toLowerCase().includes(q));
}

function render() {
  const zones = ['aviabit', 'portal', 'other'];
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const active = tasks.filter(t => !t.deleted);
  const trash = tasks.filter(t => t.deleted);

  document.getElementById('totalCount').textContent = active.length;
  document.getElementById('progressCount').textContent = active.filter(t => !t.done).length;
  document.getElementById('doneCount').textContent = active.filter(t => t.done).length;
  document.getElementById('trashCount').textContent = trash.length;
  document.getElementById('trashSectionCount').textContent = trash.length;

  zones.forEach(zone => {
    const container = document.querySelector('[data-notes="' + zone + '"]');
    const zoneActive = active.filter(t => t.zone === zone);
    const zoneTasks = zoneActive.filter(t => matchesQuery(t, q));
    document.querySelector('[data-count="' + zone + '"]').textContent = zoneTasks.length;

    if (zoneTasks.length === 0) {
      container.innerHTML = '<div class="empty">' + (zoneActive.length ? 'Ничего не найдено' : 'Пока пусто') + '</div>';
      return;
    }
    container.innerHTML = zoneTasks.map(t => {
      const parts = splitEmoji(t.text);
      const chip = parts.emoji ? '<span class="emoji-chip">' + parts.emoji + '</span>' : '';
      const subDone = t.subtasks.filter(s => s.done).length;
      const subChip = t.subtasks.length ? '<span class="sub-count">' + subDone + '/' + t.subtasks.length + '</span>' : '';
      let subBlock = '';
      if (t.subtasks.length || t.subOpen) {
        subBlock = '<div class="subtasks">' +
          t.subtasks.map(s =>
            '<div class="subtask ' + (s.done ? 'done' : '') + '">' +
            '<input type="checkbox" ' + (s.done ? 'checked' : '') + ' onchange="toggleSub(' + t.id + ',' + s.id + ')">' +
            '<span class="sub-text">' + escapeHtml(s.text) + '</span>' +
            '<button class="sub-del" onclick="delSub(event,' + t.id + ',' + s.id + ')" title="Удалить подзадачу">×</button>' +
            '</div>'
          ).join('') +
          '<input class="sub-add" data-subadd="' + t.id + '" placeholder="+ подзадача" onkeydown="subKey(event,' + t.id + ')">' +
          '</div>';
      }
      return '<div class="note ' + (t.done ? 'done' : '') + '" data-id="' + t.id + '" draggable="true">' +
        '<input type="checkbox" class="note-checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggleDone(' + t.id + ')">' +
        '<div class="note-body">' +
          '<div class="note-content" ondblclick="editTask(' + t.id + ')">' + chip + '<span class="note-text">' + escapeHtml(parts.rest) + '</span>' + subChip + '</div>' +
          subBlock +
        '</div>' +
        '<div class="note-actions">' +
          '<button class="note-action" onclick="openSubs(' + t.id + ')" title="Добавить подзадачу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>' +
          '<button class="note-action" onclick="editTask(' + t.id + ')" title="Редактировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>' +
          '<button class="note-action" onclick="openMove(' + t.id + ')" title="Переместить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></button>' +
          '<button class="note-action danger" onclick="deleteTask(' + t.id + ')" title="В корзину"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
        '</div>' +
      '</div>';
    }).join('');
  });

  const trashContent = document.getElementById('trashContent');
  const trashShown = trash.filter(t => matchesQuery(t, q));
  if (trashShown.length === 0) {
    trashContent.innerHTML = '<div class="empty">' + (trash.length ? 'Ничего не найдено' : 'Корзина пуста') + '</div>';
  } else {
    trashContent.innerHTML = trashShown.map(t =>
      '<div class="trash-note"><span class="note-text">' + escapeHtml(t.text) + '</span>' +
      '<div class="trash-actions">' +
      '<button class="trash-btn restore" onclick="restoreTask(' + t.id + ')">Восстановить</button>' +
      '<button class="trash-btn delete" onclick="permanentDelete(' + t.id + ')">Удалить</button>' +
      '</div></div>'
    ).join('');
  }
}

function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : null;
    saveTasks(); render();
  }
}
function editTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) {
    currentEditId = id;
    document.getElementById('editInput').value = t.text;
    document.getElementById('editModal').classList.add('open');
    document.getElementById('editInput').focus();
  }
}
function deleteTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) { t.deleted = true; saveTasks(); render(); }
}
function restoreTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) { t.deleted = false; saveTasks(); render(); }
}
function permanentDelete(id) {
  if (confirm('Удалить задачу навсегда?')) {
    tasks = tasks.filter(x => x.id !== id);
    saveTasks(); render();
  }
}
function openSubs(id) {
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.subOpen = true; saveTasks(); render();
    const el = document.querySelector('[data-subadd="' + id + '"]');
    if (el) el.focus();
  }
}
function toggleSub(tid, sid) {
  const t = tasks.find(x => x.id === tid);
  if (t) {
    const s = t.subtasks.find(y => y.id === sid);
    if (s) { s.done = !s.done; saveTasks(); render(); }
  }
}
function delSub(event, tid, sid) {
  event.preventDefault(); event.stopPropagation();
  const t = tasks.find(x => x.id === tid);
  if (t) { t.subtasks = t.subtasks.filter(y => y.id !== sid); saveTasks(); render(); }
}
function subKey(event, tid) {
  if (event.key === 'Enter') {
    const value = event.target.value.trim();
    if (value) {
      const t = tasks.find(x => x.id === tid);
      if (t) {
        t.subtasks.push({id: Date.now(), text: value, done: false});
        saveTasks(); render();
        setTimeout(() => {
          const el = document.querySelector('[data-subadd="' + tid + '"]');
          if (el) el.focus();
        }, 0);
      }
    }
  }
}
function openMove(id) { currentMoveId = id; document.getElementById('moveModal').classList.add('open'); }
function closeMove() { document.getElementById('moveModal').classList.remove('open'); }
function moveTask(zone) {
  const t = tasks.find(x => x.id === currentMoveId);
  if (t) { t.zone = zone; saveTasks(); render(); }
  closeMove();
}

// Быстрый захват
document.getElementById('quickAdd').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = e.target.value.trim();
    if (text) {
      tasks.push({id: Date.now(), zone: 'other', text, done: false, created: new Date().toISOString(), doneAt: null, deleted: false, subtasks: [], subOpen: false});
      saveTasks(); render();
      e.target.value = '';
    }
  }
});

// Поиск
document.getElementById('searchInput').addEventListener('input', render);

// Добавление через "+"
document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentAddZone = btn.dataset.zone;
    document.getElementById('addInput').value = '';
    document.getElementById('addModal').classList.add('open');
    document.getElementById('addInput').focus();
  });
});
document.getElementById('cancelAdd').addEventListener('click', () => document.getElementById('addModal').classList.remove('open'));
document.getElementById('confirmAdd').addEventListener('click', () => {
  const text = document.getElementById('addInput').value.trim();
  if (text) {
    tasks.push({id: Date.now(), zone: currentAddZone, text, done: false, created: new Date().toISOString(), doneAt: null, deleted: false, subtasks: [], subOpen: false});
    saveTasks(); render();
    document.getElementById('addModal').classList.remove('open');
  }
});
document.getElementById('addInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('confirmAdd').click();
  if (e.key === 'Escape') document.getElementById('cancelAdd').click();
});
document.getElementById('cancelEdit').addEventListener('click', () => document.getElementById('editModal').classList.remove('open'));
document.getElementById('confirmEdit').addEventListener('click', () => {
  const text = document.getElementById('editInput').value.trim();
  const t = tasks.find(x => x.id === currentEditId);
  if (text && t) {
    t.text = text; saveTasks(); render();
    document.getElementById('editModal').classList.remove('open');
  }
});
document.getElementById('editInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('confirmEdit').click();
  if (e.key === 'Escape') document.getElementById('cancelEdit').click();
});
document.getElementById('trashToggle').addEventListener('click', () => {
  document.getElementById('trashContent').classList.toggle('open');
  document.getElementById('trashArrow').classList.toggle('open');
});

// Drag-and-drop
document.addEventListener('dragstart', e => {
  const note = e.target.closest ? e.target.closest('.note') : null;
  if (!note) return;
  if (e.target.closest && e.target.closest('input,button')) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', note.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  note.classList.add('dragging');
});
document.addEventListener('dragend', e => {
  const note = e.target.closest ? e.target.closest('.note') : null;
  if (note) note.classList.remove('dragging');
});
document.querySelectorAll('.zone').forEach(z => {
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('drop-hover'); });
  z.addEventListener('dragleave', () => z.classList.remove('drop-hover'));
  z.addEventListener('drop', e => {
    e.preventDefault(); z.classList.remove('drop-hover');
    const id = Number(e.dataTransfer.getData('text/plain'));
    const t = tasks.find(x => x.id === id);
    if (t && !t.deleted) { t.zone = z.dataset.zone; saveTasks(); render(); }
  });
});
const trashDrop = document.getElementById('trashDrop');
trashDrop.addEventListener('dragover', e => { e.preventDefault(); trashDrop.classList.add('drop-hover'); });
trashDrop.addEventListener('dragleave', () => trashDrop.classList.remove('drop-hover'));
trashDrop.addEventListener('drop', e => {
  e.preventDefault(); trashDrop.classList.remove('drop-hover');
  const id = Number(e.dataTransfer.getData('text/plain'));
  const t = tasks.find(x => x.id === id);
  if (t && !t.deleted) { t.deleted = true; saveTasks(); render(); }
});

// Резервные копии
document.getElementById('backupDownload').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'darya_board_backup_' + new Date().toISOString().split('T')[0] + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
});
document.getElementById('backupUpload').addEventListener('click', () => {
  document.getElementById('backupFile').click();
});
document.getElementById('backupFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(raw => {
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) { alert('Файл не похож на резервную копию доски'); return; }
      if (confirm('Заменить текущие задачи данными из файла (' + parsed.length + ' шт.)?')) {
        tasks = parsed;
        tasks.forEach(t => {
          if (!Array.isArray(t.subtasks)) t.subtasks = [];
          if (t.subOpen === undefined) t.subOpen = false;
          if (t.doneAt === undefined) t.doneAt = t.done ? new Date().toISOString() : null;
        });
        saveTasks(); render();
      }
    } catch (err) {
      alert('Не удалось прочитать файл: ' + err.message);
    }
    e.target.value = '';
  });
});

// Отчёт с датой завершения
document.getElementById('generateReport').addEventListener('click', () => {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (!from || !to) { alert('Выберите период для отчёта'); return; }
  const fromDate = new Date(from);
  const toDate = new Date(to); toDate.setHours(23, 59, 59, 999);
  const zoneNames = {aviabit: 'Авиабит', portal: 'Портал 2.0', other: 'Прочее'};

  const doneInPeriod = tasks.filter(t => !t.deleted && t.done && t.doneAt && (() => { const d = new Date(t.doneAt); return d >= fromDate && d <= toDate; })());
  const openTasks = tasks.filter(t => !t.deleted && !t.done && new Date(t.created) <= toDate);

  let report = '# Еженедельный статус\n**Период:** ' + from + ' — ' + to + '\n\n';
  report += '**Выполнено за период:** ' + doneInPeriod.length + '\n';
  report += '**В работе на конец периода:** ' + openTasks.length + '\n\n';

  Object.keys(zoneNames).forEach(key => {
    const zoneDone = doneInPeriod.filter(t => t.zone === key);
    const zoneOpen = openTasks.filter(t => t.zone === key);
    if (!zoneDone.length && !zoneOpen.length) return;
    report += '## ' + zoneNames[key] + '\n\n';
    if (zoneDone.length) {
      report += '### Выполнено за период\n';
      zoneDone.forEach(t => report += '- ✅ ' + t.text + ' (' + t.doneAt.split('T')[0] + ')\n');
      report += '\n';
    }
    if (zoneOpen.length) {
      report += '### В работе\n';
      zoneOpen.forEach(t => report += '- ' + t.text + '\n');
      report += '\n';
    }
  });

  navigator.clipboard.writeText(report).then(() => alert('Отчёт скопирован в буфер обмена!'));
});

const today = new Date().toISOString().split('T')[0];
const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
document.getElementById('dateFrom').value = weekAgo;
document.getElementById('dateTo').value = today;

document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
});

render();
</script>
