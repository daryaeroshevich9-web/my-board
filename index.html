<!doctype html>
<!-- board v3.0 stage-1-fix -->
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Доска Дарьи</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Боковая панель">
      <div class="sidebar-brand" title="Доска Дарьи">Д</div>
      <nav class="sidebar-actions">
        <button
          id="sidebarPin"
          class="sidebar-btn"
          data-action="toggle-sidebar-pin"
          title="Закрепить боковую панель"
          type="button"
        >
          📌
        </button>
        <button
          id="settingsOpen"
          class="sidebar-btn"
          data-action="open-settings"
          title="Настройки"
          type="button"
        >
          ⚙️
        </button>
        <button
          id="backupDownload"
          class="sidebar-btn"
          data-action="download-backup"
          title="Скачать резервную копию"
          type="button"
        >
          💾
        </button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1>Доска Дарьи</h1>
        <div class="topbar-actions">
          <button class="btn" data-action="download-backup" type="button">
            Резервная копия
          </button>
          <button class="btn" data-action="upload-backup" type="button">
            Загрузить резервную копию
          </button>
          <button class="btn" data-action="open-archive" type="button">
            Архив
          </button>
          <button class="btn" data-action="sweep-done" type="button">
            Метла
          </button>
          <button class="btn" data-action="open-zones" type="button">
            Разделы
          </button>
          <button class="btn btn-primary" data-action="open-settings" type="button">
            Настройки
          </button>
        </div>
      </header>

      <section class="quickadd">
        <textarea
          id="quickAddInput"
          class="quickadd-input"
          rows="1"
          placeholder="Новая задача. Вставь несколько строк, чтобы создать список. Магия дат: сегодня, завтра, 12.05"
        ></textarea>
        <button
          id="quickAddSubmit"
          class="btn btn-primary"
          data-action="quick-add-submit"
          type="button"
        >
          Добавить
        </button>
      </section>

      <section class="board-toolbar">
        <input
          id="boardSearch"
          class="input board-search"
          placeholder="Поиск по доске: тема, описание, подзадачи"
          autocomplete="off"
        />
      </section>

      <div id="boardSummary" class="board-summary" aria-live="polite"></div>
      <section id="board" class="board" aria-live="polite"></section>
    </main>
  </div>

  <input
    id="backupFileInput"
    type="file"
    accept="application/json,.json"
    hidden
  />

  <div id="toast" class="toast-stack" aria-live="polite"></div>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="modal-header">
        <h2 id="settingsTitle">Настройки</h2>
        <button
          id="settingsClose"
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <p id="onboardingNote" class="notice">
          Укажи токен доступа к GitHub для синхронизации с облаком. Токен хранится
          только в этом браузере.
        </p>

        <label class="field" for="settingsToken">Токен</label>
        <input
          id="settingsToken"
          class="input"
          type="password"
          autocomplete="off"
          spellcheck="false"
          data-autofocus
        />
      </div>

      <div class="modal-footer">
        <button
          id="settingsSave"
          class="btn btn-primary"
          data-action="save-settings"
          type="button"
        >
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmTitle"
    >
      <div class="modal-header">
        <h2 id="confirmTitle">Подтверждение</h2>
        <button
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <p id="confirmMessage"></p>
      </div>

      <div class="modal-footer">
        <button id="confirmCancel" class="btn" data-action="confirm-cancel" type="button">
          Отмена
        </button>
        <button id="confirmOk" class="btn btn-primary" data-action="confirm-ok" type="button">
          Подтвердить
        </button>
      </div>
    </div>
  </div>

  <div id="zonesModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="zonesTitle"
    >
      <div class="modal-header">
        <h2 id="zonesTitle">Разделы</h2>
        <button
          id="zonesClose"
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <div id="zonesList" class="list-stack"></div>

        <div class="zone-create">
          <input
            id="zoneNewLabel"
            class="input"
            placeholder="Новый раздел"
            autocomplete="off"
          />
          <button
            id="zoneCreateBtn"
            class="btn btn-primary"
            data-action="create-zone"
            type="button"
          >
            Создать раздел
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="archiveModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="archiveTitle"
    >
      <div class="modal-header">
        <h2 id="archiveTitle">Архив</h2>
        <button
          id="archiveClose"
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <input
          id="archiveSearch"
          class="input"
          placeholder="Поиск по архиву"
          autocomplete="off"
        />
        <div id="archiveList" class="list-stack"></div>
      </div>
    </div>
  </div>

  <div id="quickZoneModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="quickZoneTitle"
    >
      <div class="modal-header">
        <h2 id="quickZoneTitle">Выбор раздела</h2>
        <button
          id="quickZoneClose"
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <div id="quickZoneList" class="list-stack"></div>
      </div>
    </div>
  </div>

  <div id="dueModal" class="modal" hidden>
    <div class="modal-backdrop" data-action="modal-close"></div>
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dueTitle"
    >
      <div class="modal-header">
        <h2 id="dueTitle">Срок задачи</h2>
        <button
          id="dueClose"
          class="icon-btn"
          data-action="modal-close"
          aria-label="Закрыть"
          type="button"
        >
          ✕
        </button>
      </div>

      <div class="modal-body">
        <input id="dueDateInput" class="input" type="date" data-autofocus />
      </div>

      <div class="modal-footer">
        <button class="btn" data-action="due-clear" type="button">
          Очистить
        </button>
        <button class="btn btn-primary" data-action="due-save" type="button">
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
